spring:
  application:
    name: event-service

  # Java 21 : les requetes HTTP sont servies par des threads virtuels.
  # Sur une charge I/O-bound (base, reseau), ils coutent quelques centaines
  # d'octets la ou un thread de plateforme en coute ~1 Mo.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/events_db
    username: ${POSTGRES_USER:eventflow}
    password: ${POSTGRES_PASSWORD:change_me}

  jpa:
    hibernate:
      # Flyway cree le schema, Hibernate se contente de verifier qu'il est
      # d'accord. `update` en production est une faute grave : il ne sait ni
      # supprimer ni renommer sans perdre de donnees.
      ddl-auto: validate
    # Ferme la session JPA a la sortie de la couche applicative. Sinon les
    # entites restent attachees pendant la serialisation JSON et declenchent
    # des requetes invisibles depuis la vue.
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Expose /health/liveness et /health/readiness, que consommeront
      # ECS et Kubernetes en phase 9.
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
